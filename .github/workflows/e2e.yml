name: e2e

# The checks that run the real coding agents: what each does with the raw output of a hook (exit codes, JSON in its own dialect, ask, text that
# is not JSON, a hook that runs too long), and everyhook installed into each (block-force-push, log-tool-calls and protect-env-files, every answer
# at every event, --matcher, --scope project, --fail-closed, a missing everyhook, a refused prompt, context at the start of a session, a stop
# hook that sends the agent back to work), then uninstalled to the exact bytes. Claude Code, Codex CLI, Gemini CLI and GitHub Copilot CLI each
# talk to a fake API on 127.0.0.1, so the checks cost nothing and need no login. On Linux, macOS and Windows. Optional by design: an agent that
# cannot be installed has its checks skipped, and the log says which. Weekly, so a release of an agent that changes how it treats a hook shows
# up here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Version of @anthropic-ai/claude-code to install (default: the newest)"
        required: false
        default: "latest"
      codex_version:
        description: "Version of @openai/codex to install (default: the newest)"
        required: false
        default: "latest"
      gemini_version:
        description: "Version of @google/gemini-cli to install (default: the newest)"
        required: false
        default: "latest"
      copilot_version:
        description: "Version of @github/copilot to install (default: the newest)"
        required: false
        default: "latest"

jobs:
  agents:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code (its checks skip if this fails)
        run: npm install -g @anthropic-ai/claude-code@${{ inputs.claude_version || 'latest' }}
        continue-on-error: true
      - name: Install Codex CLI (its checks skip if this fails)
        run: npm install -g @openai/codex@${{ inputs.codex_version || 'latest' }}
        continue-on-error: true
      - name: Install Gemini CLI (its checks skip if this fails)
        run: npm install -g @google/gemini-cli@${{ inputs.gemini_version || 'latest' }}
        continue-on-error: true
      - name: Install GitHub Copilot CLI (its checks skip if this fails)
        run: npm install -g @github/copilot@${{ inputs.copilot_version || 'latest' }}
        continue-on-error: true
      - name: Versions
        shell: bash
        run: |
          node --version && git --version
          for c in claude codex gemini copilot; do echo "== $c"; $c --version || echo "$c is not installed: its checks will skip"; done
        continue-on-error: true
      - name: Real-agent checks
        run: node --test --test-concurrency=1 test/e2e-conformance.test.mjs test/e2e-adapter.test.mjs
        env:
          E2E_CLAUDE: claude
          E2E_CODEX: codex
          E2E_GEMINI: gemini
          E2E_COPILOT: copilot
